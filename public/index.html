<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clio</title>
<style>
  :root {
    --bg: #faf8f4; --card: #ffffff; --ink: #2b2721; --muted: #8a8172;
    --line: #e7e1d6; --gold: #b8860b; --ok: #3d7a4a; --warn: #b05a1d; --crit: #a32c2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 22px 28px 14px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  header .tag { color: var(--muted); font-size: 13px; }
  main { max-width: 1060px; margin: 0 auto; padding: 20px 28px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
       color: var(--muted); margin: 28px 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .sys { font-weight: 600; font-size: 16px; }
  .card .hash { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
                color: var(--muted); word-break: break-all; margin: 6px 0; }
  .card .meta { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; border-radius: 20px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
  .b-ok { background: #e6f0e8; color: var(--ok); }
  .b-bad { background: #f7e2e2; color: var(--crit); }
  .b-info { background: #eee9dd; color: var(--muted); }
  .b-warn { background: #f7ead9; color: var(--warn); }
  .b-critical { background: #f7e2e2; color: var(--crit); }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px;
           border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .warning { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
             background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .warning .body { flex: 1; }
  .warning .title { font-weight: 600; }
  .warning .detail { font-size: 13px; color: var(--muted); }
  .quiet { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  table { border-collapse: collapse; width: 100%; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f3efe7; font-weight: 600; }
  td.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  select, input[type=text] { font: inherit; font-size: 13px; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
  #askthread { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--bg); }
  .msg.clio { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg table { margin-top: 8px; }
  .askrow { display: flex; gap: 8px; }
  .askrow input { flex: 1; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Clio</h1>
  <span class="tag">the historian does not take edits from the people she is writing about</span>
</header>
<main>
  <h2>Systems</h2>
  <div id="systems" class="cards"><div class="quiet">Loading…</div></div>

  <h2>Warnings <button id="scanBtn" style="float:right" title="Run the pattern scan now">Scan now</button></h2>
  <div id="warnings"><div class="quiet">Loading…</div></div>

  <h2>Ask the logs</h2>
  <div id="askwrap">
    <div id="askthread"></div>
    <div class="askrow">
      <input type="text" id="askInput" placeholder="Who logged the most failed logins this week?">
      <button class="primary" id="askBtn">Ask</button>
    </div>
  </div>

  <h2>Log tail</h2>
  <div class="controls">
    <select id="logSystem"></select>
    <input type="text" id="logFilter" placeholder="filter payloads…">
    <button id="logRefresh">Refresh</button>
  </div>
  <div id="logs" class="scroll"><div class="quiet">Pick a system.</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const j = async (url, opts) => (await fetch(url, opts)).json();
const post = (url, body) => j(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
let AI = false;

async function loadOverview() {
  const o = await j("/api/overview");
  AI = o.ai;
  const el = $("systems");
  if (!o.systems.length) {
    el.innerHTML = '<div class="quiet">Nothing logged yet. Point a system at POST /v1/log and the chain starts itself.</div>';
    return;
  }
  el.innerHTML = o.systems.map((s) => `
    <div class="card" data-sys="${esc(s.system_id)}">
      <div class="sys">${esc(s.system_id)}
        ${s.open_warnings ? `<span class="badge b-warn">${s.open_warnings} open</span>` : ""}
        <span class="badge verify-badge b-info">unverified</span></div>
      <div class="hash">head #${s.seq} · ${esc(s.entry_hash || "")}</div>
      <div class="meta">${s.entry_count} entries · last ${esc((s.last_ts_server || "").replace("T", " ").slice(0, 19))}</div>
      <div style="margin-top:8px"><button onclick="verify('${esc(s.system_id)}', this)">Verify chain</button></div>
    </div>`).join("");
  const sel = $("logSystem");
  sel.innerHTML = o.systems.map((s) => `<option>${esc(s.system_id)}</option>`).join("");
  loadLogs();
}

async function verify(sys, btn) {
  btn.textContent = "Verifying…";
  const v = await j("/api/verify?system_id=" + encodeURIComponent(sys));
  const badge = btn.closest(".card").querySelector(".verify-badge");
  badge.className = "badge verify-badge " + (v.valid ? "b-ok" : "b-bad");
  badge.textContent = v.valid ? `intact (${v.checked} checked)` : `BROKEN at #${v.first_bad_seq}`;
  btn.textContent = "Verify chain";
}

async function loadWarnings() {
  const w = await j("/api/warnings");
  const el = $("warnings");
  if (!w.warnings.length) { el.innerHTML = '<div class="quiet">No open warnings. Quiet is good.</div>'; return; }
  el.innerHTML = w.warnings.map((x) => `
    <div class="warning">
      <span class="badge b-${esc(x.severity)}">${esc(x.severity)}</span>
      <div class="body">
        <div class="title">${esc(x.title)} <span class="quiet">· ${esc(x.system_id)}</span></div>
        <div class="detail">${esc(x.detail)}</div>
      </div>
      <button onclick="ack('${esc(x.id)}')">Acknowledge</button>
    </div>`).join("");
}

async function ack(id) { await post("/api/warnings/" + id + "/ack"); loadWarnings(); loadOverview(); }

$("scanBtn").onclick = async () => {
  $("scanBtn").textContent = "Scanning…";
  await post("/api/scan", { force: true });
  $("scanBtn").textContent = "Scan now";
  loadWarnings();
};

async function loadLogs() {
  const sys = $("logSystem").value;
  if (!sys) return;
  const q = $("logFilter").value.trim();
  const r = await j("/api/logs?limit=50&system_id=" + encodeURIComponent(sys) + (q ? "&q=" + encodeURIComponent(q) : ""));
  $("logs").innerHTML = r.entries.length ? `
    <table><tr><th>#</th><th>when (server)</th><th>action</th><th>payload</th></tr>
    ${r.entries.map((e) => `<tr><td>${e.seq}</td>
      <td>${esc(e.ts_server.replace("T", " ").slice(0, 19))}</td>
      <td>${esc(e.action)}</td><td class="mono">${esc(e.payload_json)}</td></tr>`).join("")}
    </table>` : '<div class="quiet">No entries match.</div>';
}
$("logRefresh").onclick = loadLogs;
$("logSystem").onchange = loadLogs;
$("logFilter").onkeydown = (e) => { if (e.key === "Enter") loadLogs(); };

const askMessages = [];
function renderTable(a) {
  return `<div class="scroll"><table><tr>${a.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
    ${a.rows.slice(0, 50).map((r) => `<tr>${a.columns.map((c) => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
async function ask() {
  const q = $("askInput").value.trim();
  if (!q) return;
  $("askInput").value = "";
  askMessages.push({ role: "user", content: q });
  const thread = $("askthread");
  thread.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(q)}</div>`);
  thread.insertAdjacentHTML("beforeend", `<div class="msg clio" id="pending">…</div>`);
  const r = await post("/api/ask", { messages: askMessages });
  const el = $("pending"); el.removeAttribute("id");
  if (r.error) { el.textContent = "Something went wrong: " + r.error; return; }
  askMessages.push({ role: "assistant", content: r.reply });
  el.innerHTML = esc(r.reply) + (r.artifacts || []).map(renderTable).join("");
}
$("askBtn").onclick = ask;
$("askInput").onkeydown = (e) => { if (e.key === "Enter") ask(); };

loadOverview(); loadWarnings();
setInterval(() => { loadOverview(); loadWarnings(); }, 60000);
</script>
</body>
</html>
