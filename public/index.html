<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clio</title>
<style>
  :root { --bg:#faf9f5; --panel:#ffffff; --panel2:#f1eee7; --line:#e8e4da; --ink:#211f1a; --muted:#6f6a5f; --accent:#c15f3c; --accent2:#d97757; --good:#2e7d5b; --bad:#c04f4f; --shadow:0 1px 2px rgba(60,50,30,.05),0 3px 12px rgba(60,50,30,.06);
    --side:#f5f3ec; --dim:#a39d8f; --track:#ece8de; --goodbg:#e7f2ec; --offbg:#f1eee7; --warnbg:#f7ead9; --warnc:#a05a1a; --critbg:#f7e2e2; --critc:#a32c2c;
    --gold:#b8923e; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; }
  html.dark { --bg:#1b1915; --panel:#242119; --panel2:#2f2b20; --line:#3c3628; --ink:#ece8df; --muted:#a9a292; --accent:#d97757; --accent2:#e08b6d; --good:#4cbd8b; --bad:#e0707a; --shadow:0 1px 2px rgba(0,0,0,.28),0 3px 14px rgba(0,0,0,.26);
    --side:#211e17; --dim:#7c7565; --track:#2f2b20; --goodbg:#22352a; --offbg:#2b2720; --warnbg:#3a2e1d; --warnc:#e0a366; --critbg:#3a2222; --critc:#e08a8a; --gold:#c9a24b; }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--track) transparent; }
  ::-webkit-scrollbar { width:9px; height:9px; } ::-webkit-scrollbar-thumb { background:var(--track); border-radius:6px; border:2px solid transparent; background-clip:content-box; }
  html, body { margin:0; height:100%; }
  body { display:flex; height:100vh; overflow:hidden; background:var(--bg); color:var(--ink); font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; cursor:pointer; border:0; background:none; color:inherit; }
  input, select, textarea { font:inherit; }
  .side { width:236px; flex:none; background:linear-gradient(180deg,var(--side) 55%,var(--bg)); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .side-top { padding:16px 15px 12px; }
  .brand { font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:.03em; display:flex; align-items:center; gap:9px; }
  .brand svg { width:24px; height:24px; flex:none; }
  .brand .tag { display:block; font-family:inherit; font-size:10.5px; font-weight:400; color:var(--dim); letter-spacing:0; margin-top:2px; }
  .side-list { flex:1; overflow-y:auto; padding:8px; }
  .navitem { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; color:var(--muted); cursor:pointer; font-size:14px; margin-bottom:2px; }
  .navitem:hover { background:var(--panel); color:var(--ink); }
  .navitem.on { background:var(--panel2); color:var(--ink); box-shadow:inset 3px 0 0 var(--accent2); font-weight:600; }
  .navitem .ico { width:18px; text-align:center; font-size:15px; flex:none; }
  .navitem .cnt { margin-left:auto; font-size:11.5px; background:var(--warnbg); color:var(--warnc); border-radius:12px; padding:0 8px; font-weight:600; }
  .side-foot { padding:10px 12px 14px; border-top:1px solid var(--line); }
  .footrow { display:flex; align-items:center; gap:8px; }
  .footbtn { color:var(--muted); font-size:13px; padding:6px 8px; border-radius:8px; display:flex; align-items:center; gap:7px; }
  .footbtn:hover { background:var(--panel); color:var(--ink); }
  .footinfo { color:var(--dim); font-size:11.5px; margin-top:6px; padding:0 8px; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .main-head { display:flex; align-items:center; gap:12px; padding:16px 26px 12px; border-bottom:1px solid var(--line); }
  .main-head .title { font-family:var(--serif); font-size:20px; font-weight:600; }
  .main-head .sub { color:var(--muted); font-size:13px; }
  .main-head .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .view { flex:1; overflow-y:auto; display:none; } .view.on { display:flex; flex-direction:column; }
  .wrap { max-width:940px; margin:0 auto; width:100%; padding:20px 26px 40px; } .wrap.wide { max-width:1080px; }
  .btn { padding:7px 15px; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; } .btn:hover { filter:brightness(1.06); }
  .btn.ghost { background:var(--panel2); color:var(--ink); } .btn.sm { padding:5px 11px; font-size:12.5px; } .btn:disabled { opacity:.5; cursor:default; }
  .link { color:var(--accent2); font-size:12.5px; } .link.danger { color:var(--bad); }
  .input { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--ink); font-size:13.5px; width:100%; }
  .input:focus { outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px rgba(217,119,87,.15); }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; } .field > span { font-size:12.5px; font-weight:500; color:var(--muted); }
  .pulsebar { display:flex; gap:13px; align-items:flex-start; background:linear-gradient(135deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:14px; padding:15px 17px; margin-bottom:18px; box-shadow:var(--shadow); }
  .pulsebar svg { width:26px; height:26px; flex:none; margin-top:1px; } .pulsebar .ptext { font-size:14.5px; } .pulsebar .pmeta { color:var(--dim); font-size:11.5px; margin-top:5px; }
  #thread { display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:86%; padding:11px 15px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 2px 8px rgba(193,95,60,.2); }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); }
  .msg.meta { align-self:center; color:var(--muted); font-size:12.5px; background:none; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:18px; padding:6px 13px; font-size:12.5px; color:var(--muted); cursor:pointer; } .chip:hover { border-color:var(--accent2); color:var(--ink); }
  .chip.on { background:var(--accent2); color:#fff; border-color:var(--accent2); }
  .composer { border-top:1px solid var(--line); padding:14px 26px; display:flex; justify-content:center; }
  .composer .inner { max-width:940px; width:100%; display:flex; gap:9px; }
  .composer textarea { flex:1; resize:none; height:46px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--panel); color:var(--ink); } .composer textarea:focus { outline:none; border-color:var(--accent2); }
  .sendbtn { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; border-radius:12px; padding:0 20px; font-weight:600; } .sendbtn:hover { filter:brightness(1.07); }
  .scroll { overflow-x:auto; }
  .feedbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .feed { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:11px; align-items:baseline; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 13px; font-size:13px; box-shadow:var(--shadow); }
  .row.fresh { animation:arrive .9s ease; } @keyframes arrive { from { background:var(--goodbg); } to { background:var(--panel); } }
  .row .t { color:var(--dim); font-size:11px; white-space:nowrap; width:56px; flex:none; }
  .row .sys { color:var(--muted); font-size:11.5px; white-space:nowrap; flex:none; width:96px; overflow:hidden; text-overflow:ellipsis; }
  .row .main { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; } .row .main .did { font-weight:400; color:var(--muted); }
  .tag { flex:none; font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:.03em; }
  .tag.create { background:var(--goodbg); color:var(--good); } .tag.read { background:var(--panel2); color:var(--muted); }
  .tag.update { background:var(--warnbg); color:var(--warnc); } .tag.delete { background:var(--critbg); color:var(--critc); }
  .tag.login { background:#e6eef7; color:#3a6ea5; } html.dark .tag.login { background:#1e2a3a; color:#8ab4e0; }
  .tag.export { background:var(--offbg); color:var(--accent); } .tag.admin { background:#efe3f5; color:#7a3ea0; } html.dark .tag.admin { background:#2e2440; color:#c9a6e6; }
  .tag.other { background:var(--panel2); color:var(--dim); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:13px; }
  .scard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .scard-h { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
  .syscard { cursor:pointer; } .syscard:hover { border-color:var(--accent2); }
  .syscard .sys { font-family:var(--serif); font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .syscard .today { margin-left:auto; font-size:12.5px; font-weight:600; background:var(--goodbg); color:var(--good); border-radius:12px; padding:1px 10px; }
  .syscard .today.zero { background:var(--panel2); color:var(--dim); }
  .syscard .files { color:var(--muted); font-size:12.5px; margin-top:6px; } .syscard .meta { color:var(--dim); font-size:12px; margin-top:6px; }
  .badge { display:inline-block; border-radius:12px; padding:1px 9px; font-size:11.5px; font-weight:600; }
  .b-ok { background:var(--goodbg); color:var(--good); } .b-bad { background:var(--critbg); color:var(--critc); }
  .b-warn { background:var(--warnbg); color:var(--warnc); } .b-info { background:var(--panel2); color:var(--muted); }
  .b-critical { background:var(--critbg); color:var(--critc); } .b-hipaa { background:#efe3f5; color:#7a3ea0; } html.dark .b-hipaa { background:#2e2440; color:#c9a6e6; }
  .warning { display:flex; gap:12px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow); }
  .warning .body { flex:1; } .warning .title { font-weight:600; } .warning .detail { font-size:13px; color:var(--muted); margin-top:2px; } .warning .src { font-size:10.5px; color:var(--dim); }
  .quiet { color:var(--dim); font-size:13.5px; padding:14px 2px; }
  .overlay { position:fixed; inset:0; background:rgba(30,26,18,.55); display:none; align-items:center; justify-content:center; z-index:40; padding:5vh 16px; } .overlay.open { display:flex; }
  .panel { width:min(680px,95vw); max-height:88vh; background:var(--bg); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; box-shadow:0 12px 48px rgba(0,0,0,.3); }
  .p-head { display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--line); } .p-head .ttl { font-family:var(--serif); font-size:18px; font-weight:600; } .p-head .x { margin-left:auto; color:var(--dim); font-size:20px; }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; border-bottom:1px solid var(--line); } .tabs button { border:1px solid transparent; border-bottom:none; padding:8px 16px; border-radius:9px 9px 0 0; color:var(--muted); font-size:13.5px; font-weight:600; } .tabs button.on { background:var(--panel); border-color:var(--line); color:var(--ink); margin-bottom:-1px; padding-bottom:9px; }
  .p-list { overflow-y:auto; padding:16px 18px 24px; flex:1; }
  .hint { color:var(--dim); font-size:12px; margin-top:4px; }
  .setrow { display:flex; gap:10px; align-items:center; margin:8px 0; flex-wrap:wrap; } .setrow label { font-size:13px; color:var(--muted); width:130px; flex:none; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; } .kv .kk { color:var(--muted); white-space:nowrap; } .kv .kvv { word-break:break-word; }
  .rawbox { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; background:var(--panel2); border-radius:8px; padding:10px; white-space:pre-wrap; word-break:break-all; margin-top:10px; }
  .keybox { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--panel2); border-radius:8px; padding:9px 11px; word-break:break-all; margin-top:8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:10px 0; }
  .kpi { background:var(--panel2); border:1px solid var(--line); border-radius:13px; padding:12px 14px; } .kpi .k { text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; font-weight:600; color:var(--muted); } .kpi .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:3px; }
  .chart { margin:10px 0; } .chart-h { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .barrow { display:flex; align-items:center; gap:10px; margin:5px 0; font-size:12.5px; } .barrow .bl { width:130px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .barrow .bt { flex:1; height:16px; background:var(--panel2); border-radius:5px; overflow:hidden; } .barrow .bf { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent2),var(--accent)); } .barrow .bv { width:52px; flex:none; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .msg table,table.tbl { border-collapse:collapse; margin-top:8px; font-size:12.5px; width:100%; } .msg th,.msg td,table.tbl th,table.tbl td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--line); } .msg th,table.tbl th { color:var(--muted); font-weight:600; }
  .toggle { position:relative; width:38px; height:22px; border-radius:12px; background:var(--line); cursor:pointer; flex:none; transition:background .15s; } .toggle.on { background:var(--good); } .toggle .knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; } .toggle.on .knob { left:18px; }
  .banner { background:var(--warnbg); border:1px solid var(--warnc); color:var(--warnc); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .dbrow { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); } .dbrow .dbc { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<aside class="side">
  <div class="side-top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 13h4l2.2-6.5L12 19l2.6-9.5L16.4 13H22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>Clio<span class="tag">FileMaker logging for the AI Age</span></div>
    </div>
  </div>
  <div class="side-list">
    <div class="navitem on" data-v="systems"><span class="ico">▦</span> Systems</div>
    <div class="navitem" data-v="ask"><span class="ico">✦</span> Ask the logs</div>
    <div class="navitem" data-v="live"><span class="ico">◉</span> Live</div>
    <div class="navitem" data-v="history"><span class="ico">↺</span> History</div>
    <div class="navitem" data-v="warnings"><span class="ico">⚠</span> Warnings <span class="cnt" id="warnCnt" style="display:none"></span></div>
  </div>
  <div class="side-foot">
    <div class="footrow"><button class="footbtn" id="settingsBtn"><span>⚙</span> Settings</button><button class="footbtn" id="themeBtn" style="margin-left:auto" title="Theme">◐</button></div>
    <div class="footinfo" id="footInfo"></div>
  </div>
</aside>

<main class="main">
  <div class="main-head"><span class="title" id="viewTitle">Systems</span><span class="sub" id="viewSub"></span><div class="right" id="viewActions"></div></div>

  <!-- Systems (landing) -->
  <div class="view on" id="v-systems"><div class="wrap wide">
    <div id="wizardBanner"></div>
    <div class="cards" id="systems"></div>
    <div style="margin-top:16px"><button class="btn ghost sm" id="addSystemBtn">+ Add a system</button></div>
  </div></div>

  <!-- Ask -->
  <div class="view" id="v-ask">
    <div class="wrap" style="flex:1">
      <div class="pulsebar"><svg viewBox="0 0 24 24" fill="none"><path d="M2 13h4l2.2-6.5L12 19l2.6-9.5L16.4 13H22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><div class="ptext" id="pulseText">Reading the room…</div><div class="pmeta" id="pulseMeta"></div></div></div>
      <div id="thread"></div>
    </div>
    <div class="composer"><div class="inner"><textarea id="askInput" placeholder="Who deleted invoices this week? Any weekend logins?"></textarea><button class="sendbtn" id="askBtn">Ask</button></div></div>
  </div>

  <!-- Live -->
  <div class="view" id="v-live"><div class="wrap wide">
    <div class="feedbar">
      <input class="input" id="feedFilter" placeholder="filter…" style="width:220px">
      <select class="input" id="feedSystem" style="width:auto"><option value="">all systems</option></select>
      <span class="quiet" id="feedStatus" style="margin-left:auto;padding:0"></span>
    </div>
    <div class="feed" id="feed"><div class="quiet">Waiting for entries…</div></div>
  </div></div>

  <!-- History -->
  <div class="view" id="v-history"><div class="wrap wide">
    <div class="feedbar" id="histFilters">
      <select class="input" id="hSystems" multiple size="1" style="width:auto;min-width:150px"></select>
      <span id="hActions" class="chips"></span>
      <select class="input" id="hWhen" style="width:auto"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week" selected>This week</option><option value="month">This month</option><option value="range">Set range…</option></select>
      <span id="hRange" style="display:none;gap:6px" class="feedbar">
        <input class="input" id="hFrom" type="datetime-local" style="width:auto"><span class="quiet" style="padding:0">to</span><input class="input" id="hTo" type="datetime-local" style="width:auto"></span>
      <span class="quiet" id="hStatus" style="margin-left:auto;padding:0"></span>
    </div>
    <div id="history"></div>
  </div></div>

  <!-- Warnings -->
  <div class="view" id="v-warnings"><div class="wrap"><div id="warnings"></div></div></div>
</main>

<!-- Settings -->
<div class="overlay" id="settings"><div class="panel">
  <div class="p-head"><span class="ttl">Settings</span><button class="x" id="setClose">✕</button></div>
  <div class="tabs" id="setTabs"><button data-t="rules" class="on">Rules</button><button data-t="channels">Channels</button><button data-t="ai">AI</button><button data-t="about">About</button></div>
  <div class="p-list">
    <div id="tab-rules">
      <div class="setrow" style="justify-content:space-between"><div class="scard-h" style="margin:0">Rules</div><button class="btn" id="newRuleBtn">+ New rule</button></div>
      <div id="rulesList" style="margin-top:12px"></div>
    </div>
    <div id="tab-channels" style="display:none">
      <div class="scard"><div class="scard-h">Slack</div><div class="field"><span>Incoming webhook URL</span><input class="input" id="chSlack" placeholder="https://hooks.slack.com/services/…"></div></div>
      <div class="scard" style="margin-top:12px"><div class="scard-h">Webhook</div><div class="field"><span>JSON POST URL</span><input class="input" id="chWebhook" placeholder="https://…"></div></div>
      <div class="setrow" style="margin-top:12px"><button class="btn" id="chSave">Save</button><button class="btn ghost" id="chTest">Send test alert</button><span class="quiet" id="chStatus" style="padding:0"></span></div>
    </div>
    <div id="tab-ai" style="display:none">
      <div class="scard"><div class="scard-h">Model</div><div class="field"><span>Used for the pulse, ask, and rule writing</span><select class="input" id="aiModel"></select></div><div class="hint" id="aiState"></div></div>
    </div>
    <div id="tab-about" style="display:none">
      <div class="scard"><div class="scard-h">What Clio is</div><div id="aboutBox" style="font-size:13.5px;color:var(--muted);line-height:1.6"></div></div>
    </div>
  </div>
</div></div>

<!-- New rule -->
<div class="overlay" id="ruleModal"><div class="panel" style="max-height:86vh">
  <div class="p-head"><span class="ttl">New rule</span><button class="x" id="ruleModalClose">✕</button></div>
  <div class="p-list"><div id="ruleThread" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>
    <div class="setrow"><input class="input" id="ruleInput" placeholder="Describe what you want to watch for"><button class="btn" id="ruleAsk">Ask</button></div>
    <div id="ruleDraft"></div></div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const qs = new URLSearchParams(location.search);
const KEY = qs.get("key") ? "?key=" + encodeURIComponent(qs.get("key")) : "";
const api = (p) => p + (KEY && p.includes("?") ? "&" + KEY.slice(1) : KEY);
const j = (p, o) => fetch(api(p), o).then((r) => r.json());
const post = (p, b) => j(p, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(b||{}) });
const localTime = (iso) => { const d=new Date(iso); return isNaN(d)?iso:d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); };
const localHM = (iso) => { const d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); };
const fmtN = (n) => Number.isFinite(+n) ? (+n).toLocaleString() : String(n);
const fmtC = (n) => { n=+n; if(!Number.isFinite(n))return String(n); const a=Math.abs(n); if(a>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,"")+"B"; if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M"; if(a>=1e4)return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K"; return fmtN(n); };

// ---- action → friendly, CRUD tag ----
function crud(action, p) {
  const a=(action||"").toLowerCase(), type=((p&&p.type)||"").toLowerCase();
  if (/login|open database|sign|logout|close database/.test(a+" "+type)) return { cls:"login", tag:"login" };
  if (/admin|key_|privil|account\.|archive|purge|created a system/.test(a)) return { cls:"admin", tag:"admin" };
  if (/export|print|pdf|\.save/.test(a)) return { cls:"export", tag:"export" };
  if (/\.deleted?$|delete record/.test(a)||type==="delete") return { cls:"delete", tag:"delete" };
  if (/\.new$|create|\.created$/.test(a)||type==="new") return { cls:"create", tag:"create" };
  if (/modif|edit|change|update/.test(a)||type==="edit record") return { cls:"update", tag:"update" };
  if (/view|read/.test(a)||type==="read") return { cls:"read", tag:"read" };
  return { cls:"other", tag:"·" };
}
const VERB = { new:"created", created:"created", modified:"edited", deleted:"deleted" };
function displayName(d) { if(!d||typeof d!=="object")return""; for(const k of ["Company Name","Name","Title","Task Name","Note","field_name"]) if(d[k]) return String(d[k]).slice(0,60); for(const [k,v] of Object.entries(d)){ if(/id|^z_|TS$|date/i.test(k))continue; if(typeof v==="string"&&v&&v.length<50)return v; } return ""; }
function humanLine(e) {
  let p={}; try{p=JSON.parse(e.payload_json);}catch{return{text:friendlyAction(e.action),who:""};}
  const who = p.account_name || (p.data&&p.data.z_Modifier) || "";
  if (typeof p.message==="string"&&p.message) return { text:p.message, who };
  if (p.bulk) return { text:`${fmtN(p.count)} records ${p.op} in ${p.table}`, who };
  const parts=e.action.split("."), op=parts[parts.length-1];
  if (parts.length>=3 && p.table) { const name=displayName(p.data), label=name?`${p.table} "${name}"`:`${p.table} #${p.record_id}`;
    let text; if(p.changed){const fs=Object.keys(p.changed).filter((f)=>!/^z_/.test(f)); text=fs.length?`changed ${fs.join(", ")} on ${label}`:`touched ${label}`;} else text=`${VERB[op]||op} ${label}`;
    return { text, who, mute:p.table==="fmLog" }; }
  return { text:friendlyAction(e.action), who };
}
function friendlyAction(a) { if(/\s/.test(a))return a; const p=a.split("."); if(p.length>=3){const t=p[p.length-1]; return `${VERB[t]||t} a ${p[p.length-2]} record`;} return a.replace(/[_.]/g," "); }

  const TZ=[["","(not set)"],["-8","Pacific (UTC-8)"],["-5","Eastern (UTC-5)"],["0","UTC"],["1","London/CET (UTC+1)"],["3","Athens/Crete (UTC+3)"]];

    <div class="scard"><div class="scard-h">Name &amp; server</div>

      <div class="field"><span>FileMaker server</span><input class="input" id="sysServer" value="${esc(s.fm_server||"")}"></div>

// admin only for destructive/key ops; prompt for install password just-in-time
const adminTok = () => sessionStorage.getItem("clio_admin") || "";
async function adminReq(method, path, body){
  if(!adminTok()){ const t=prompt("Admin password (only needed for creating keys or deleting):"); if(!t) return null; sessionStorage.setItem("clio_admin",t.trim()); }
  const r=await fetch(api(path),{method,headers:{Authorization:"Bearer "+adminTok(),"content-type":"application/json"},body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){ sessionStorage.removeItem("clio_admin"); alert("That password was not accepted."); return null; }
  return r.json();
}

function artifactHtml(a){

async function pollFeed(){ try{ const r=await j("/api/logs?limit=60"+(latestTs?"&since="+encodeURIComponent(latestTs):"")); if(r.entries&&r.entries.length){ if(latestTs===null)$("feed").innerHTML=""; const html=r.entries.map((e)=>{const k=e.system_id+"#"+e.seq; if(seen.has(k))return""; seen.add(k); return rowHtml(e,latestTs!==null);}).join(""); $("feed").insertAdjacentHTML("afterbegin",html); latestTs=r.latest_ts||latestTs; const rows=document.querySelectorAll("#feed .row"); for(let i=300;i<rows.length;i++)rows[i].remove(); applyFeedFilters(); } $("feedStatus").textContent="live"; }catch{ $("feedStatus").textContent="reconnecting…"; } }
function openEntry(key){ const e=feedRows[key]; if(!e)return; let p={};try{p=JSON.parse(e.payload_json);}catch{}

const HIST_ACTIONS=[["","All"],["create","Create"],["update","Update"],["delete","Delete"],["read","View"],["login","Login"],["export","Export"]];
let histAction="", histRecord=null;
function renderHistFilters(){ $("hActions").innerHTML=HIST_ACTIONS.map(([v,l])=>`<span class="chip ${histAction===v?"on":""}" onclick="histAction='${v}';renderHistFilters();runHistory()">${l}</span>`).join(""); }

["hFrom","hTo"].forEach((id)=>$(id).onchange=()=>runHistory());
$("hSystems").onchange=()=>runHistory();
function whenRange(){ const w=$("hWhen").value, now=new Date(); let since;
  if(w==="today"){since=new Date(now.getFullYear(),now.getMonth(),now.getDate());}
  else if(w==="yesterday"){since=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);}
  else if(w==="week"){since=new Date(now-7*864e5);}
  else if(w==="month"){since=new Date(now.getFullYear(),now.getMonth(),1);}
  else if(w==="range"){ return { since:$("hFrom").value?new Date($("hFrom").value).toISOString():null, until:$("hTo").value?new Date($("hTo").value).toISOString():null }; }
  return { since:since?since.toISOString():null, until:null };
}
async function runHistory(){
  const sysSel=[...$("hSystems").selectedOptions].map((o)=>o.value); const sys=sysSel.length?sysSel:(ov.systems.map((s)=>s.system_id));
  const {since,until}=whenRange();
  const base={ system_id:sys[0]||"", ...(histAction?{action_type:histAction}:{}), ...(since?{since}:{}), ...(until?{until}:{}) };
  if(histRecord){ base.table=histRecord.table; base.record_id=histRecord.record_id; base.system_id=histRecord.system; }
  $("hStatus").textContent="…";
  const d=await j("/api/history?"+new URLSearchParams(base).toString());
  $("history").innerHTML=d.items.length?`<div class="feed">${d.items.map(histRow).join("")}</div>`:'<div class="quiet">No matching changes.</div>';
  $("hStatus").textContent=`${d.count} ${d.mode==="record"?"changes":"results"}`+(histRecord?` · <a href="#" onclick="histRecord=null;runHistory();return false" style="color:var(--accent2)">clear record</a>`:"");
}
function histRow(it){ const when=localTime(it.ts);
  if(it.changes){ const lines=it.changes.map((c)=>`<div><b>${esc(c.field)}</b>: <span style="color:var(--muted)">${esc(String(c.from))}</span> → ${esc(String(c.to))}</div>`).join("")||`<div class="quiet" style="padding:0">${esc(friendlyAction(it.action))}</div>`;
    return `<div class="row" style="align-items:flex-start"><span class="t" style="width:80px">${esc(when)}</span><span class="sys">${esc(it.who||"")}</span><div class="main" style="white-space:normal">${lines}</div></div>`; }
  const c=crud(it.action,{}); return `<div class="row" onclick="recordHistory('${esc($("hSystems").value||ov.systems[0]?.system_id)}','${esc(it.table||"")}',${it.record_id})" style="cursor:pointer"><span class="t" style="width:80px">${esc(when)}</span><span class="tag ${c.cls}">${c.tag}</span><span class="sys">${esc(it.who||"")}</span><span class="main">${esc(it.table||"")} #${it.record_id??"?"} <span class="did">${esc(it.fields?it.fields.join(", "):it.message||friendlyAction(it.action))}</span></span></div>`; }
function recordHistory(system,table,record_id){ histRecord={system,table,record_id}; go("history"); }

// ---- warnings ----
async function loadWarnings(){ const w=await j("/api/warnings"); const cnt=$("warnCnt"); cnt.style.display=w.warnings.length?"":"none"; cnt.textContent=w.warnings.length;
  $("warnings").innerHTML=w.warnings.length?w.warnings.map((x)=>`<div class="warning"><span class="badge b-${esc(x.severity)}">${esc(x.severity)}</span><div class="body"><div class="title">${esc(x.title)} ${x.class?`<span class="badge b-hipaa">${esc(x.class)}</span>`:""}</div><div class="detail">${esc(x.detail)}</div></div><button class="btn ghost sm" onclick="ackW('${esc(x.id)}')">Acknowledge</button></div>`).join(""):'<div class="quiet">No open warnings. Quiet is good.</div>'; }
async function ackW(id){ await post("/api/warnings/"+id+"/ack"); loadWarnings(); loadOverview(); }
$("viewActions").innerHTML=`<button class="btn ghost sm" id="scanBtn">Scan now</button>`;
$("scanBtn").onclick=async()=>{ $("scanBtn").textContent="Scanning…"; await post("/api/scan",{force:true}); $("scanBtn").textContent="Scan now"; loadWarnings(); };

// ---- settings ----
$("settingsBtn").onclick=()=>{ $("settings").classList.add("open"); loadChannels(); loadAI(); loadRules(); };
$("setClose").onclick=()=>$("settings").classList.remove("open");
$("settings").onclick=(e)=>{if(e.target===$("settings"))$("settings").classList.remove("open");};
$("setTabs").querySelectorAll("button").forEach((b)=>b.onclick=()=>{ $("setTabs").querySelectorAll("button").forEach((x)=>x.classList.toggle("on",x===b)); ["rules","channels","ai","about"].forEach((t)=>$("tab-"+t).style.display=t===b.dataset.t?"":"none"); });
async function loadChannels(){ const p=await j("/api/prefs"); $("chSlack").value=p.slack_webhook||""; $("chWebhook").value=p.alert_webhook||""; }
$("chSave").onclick=async()=>{ await post("/api/prefs",{slack_webhook:$("chSlack").value.trim(),alert_webhook:$("chWebhook").value.trim()}); $("chStatus").textContent="Saved."; setTimeout(()=>$("chStatus").textContent="",2000); };
$("chTest").onclick=async()=>{ $("chStatus").textContent="Sending…"; const r=await post("/api/notify-test"); $("chStatus").textContent=`Slack ${r.sent?.slack?"✓":"—"} · webhook ${r.sent?.webhook?"✓":"—"}`; };
async function loadAI(){ const a=await j("/api/ai"); $("aiModel").innerHTML=a.models.map((m)=>`<option value="${esc(m.id)}" ${m.id===a.model?"selected":""}>${esc(m.label)}${m.legacy?" (previous)":""}</option>`).join(""); $("aiState").textContent=a.available?(a.fallback?"Showing a built-in list (couldn't reach Anthropic).":"Live model list from Anthropic."):"No AI key set. Set ANTHROPIC_API_KEY as a secret."; }
$("aiModel").onchange=async()=>{ await post("/api/ai",{model:$("aiModel").value}); };

// rules
let ruleMessages=[],pendingDraft=null;
function renderRuleThread(){ $("ruleThread").innerHTML=ruleMessages.map((m)=>m.role==="user"?`<div class="msg user" style="max-width:100%">${esc(m.content)}</div>`:`<div class="msg bot" style="max-width:100%">${renderMd(m.content)}</div>`).join(""); $("ruleThread").lastElementChild?.scrollIntoView({block:"end"}); }
$("newRuleBtn").onclick=()=>{ ruleMessages=[];pendingDraft=null;$("ruleDraft").innerHTML="";$("ruleInput").value="";renderRuleThread(); $("ruleModal").classList.add("open"); setTimeout(()=>$("ruleInput").focus(),50); };
$("ruleModalClose").onclick=()=>$("ruleModal").classList.remove("open");
$("ruleModal").onclick=(e)=>{if(e.target===$("ruleModal"))$("ruleModal").classList.remove("open");};
async function ruleAsk(){ const q=$("ruleInput").value.trim(); if(!q)return; $("ruleInput").value="";ruleMessages.push({role:"user",content:q});renderRuleThread(); const r=await post("/api/rules/author",{messages:ruleMessages}); if(r.error){ruleMessages.push({role:"assistant",content:"Error: "+r.error});renderRuleThread();return;} ruleMessages.push({role:"assistant",content:r.reply||"…"});renderRuleThread(); if(r.draft)showDraft(r.draft,r.preview); }
$("ruleAsk").onclick=ruleAsk; $("ruleInput").onkeydown=(e)=>{if(e.key==="Enter")ruleAsk();};
function showDraft(draft,preview){ pendingDraft=draft; const fired=preview?`Would have fired <b>${preview.would_fire}</b> time${preview.would_fire===1?"":"s"} in the last ${preview.days} days.`:"";
  $("ruleDraft").innerHTML=`<div class="scard" style="margin-top:12px;border-color:var(--accent2)"><div class="scard-h">Proposed rule</div><div style="font-weight:600">${esc(draft.name)} <span class="badge b-${esc(draft.severity)}">${esc(draft.severity)}</span> ${draft.class?`<span class="badge b-hipaa">${esc(draft.class)}</span>`:""}</div><div style="font-size:13px;color:var(--muted);margin:4px 0 8px">${esc(draft.description)}</div><div class="hint">${fired}</div><div class="setrow" style="margin-top:10px"><button class="btn" id="ruleSaveBtn">Save</button><button class="btn ghost" id="ruleCancelBtn">Cancel</button></div></div>`;
  $("ruleCancelBtn").onclick=()=>$("ruleModal").classList.remove("open");
  $("ruleSaveBtn").onclick=async()=>{ await post("/api/rules",pendingDraft); ruleMessages=[];pendingDraft=null;$("ruleDraft").innerHTML="";renderRuleThread(); loadRules(); $("ruleThread").innerHTML='<div class="msg meta">Saved. Describe another, or close.</div>'; }; }
async function loadRules(){ const {rules}=await j("/api/rules"); $("rulesList").innerHTML=rules.length?rules.map((r)=>`<div class="warning"><span class="toggle ${r.enabled?"on":""}" onclick="toggleRule('${r.id}',${r.enabled?0:1})"><span class="knob"></span></span><div class="body"><div class="title">${esc(r.name)} <span class="badge b-${esc(r.severity)}">${esc(r.severity)}</span> ${r.class?`<span class="badge b-hipaa">${esc(r.class)}</span>`:""}</div><div class="detail">${esc(r.description)}</div><div class="src">fired ${r.would_fire_30d??"—"}× in 30 days</div></div><button class="link danger" onclick="delRule('${r.id}')">delete</button></div>`).join(""):'<div class="quiet">No rules yet. Click "New rule".</div>'; }
async function toggleRule(id,on){ await j("/api/rules/"+id,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({enabled:!!on})}); loadRules(); }
async function delRule(id){ await j("/api/rules/"+id,{method:"DELETE"}); loadRules(); }

// ---- boot + live ----
(async()=>{
  await loadOverview(); renderThread(); renderRuleThread(); renderHistFilters();
  loadWarnings(); pollPulse(); pollFeed();
  setInterval(pollPulse,30000);
  setInterval(()=>{ loadOverview(); loadWarnings(); },60000);
  // SSE: refresh feed the instant anything lands; fall back to polling
  try{ const es=new EventSource(api("/api/stream")); es.onmessage=()=>pollFeed(); es.addEventListener("log",()=>pollFeed()); es.onerror=()=>{}; }catch{}
  setInterval(pollFeed,8000); // safety net + catch-up after sleep
})();
</script>
</body>
