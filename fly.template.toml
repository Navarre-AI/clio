# Template. setup.mjs writes your fly.toml from this with YOUR app name.
# (fly.toml itself is gitignored: it is per-install, not part of the app.)
app = "{{APP_NAME}}"
primary_region = "{{REGION}}"

[build]

[env]
  DATA_DIR = "/data"

[mounts]
  source = "clio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A log system can't sleep: a cold-start wake-up drops fire-and-forget posts,
  # and a second machine would fork the append-only chain. One machine, always on.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
